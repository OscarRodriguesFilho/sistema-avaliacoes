spring.application.name=avaliacoes-api
server.port=8080

# Banco de dados (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:avaliacoesdb}
spring.datasource.username=${DB_USER:avaliacoes_user}
spring.datasource.password=${DB_PASSWORD:avaliacoes_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Auth0: valida assinatura, emissor (issuer) e audience do access token
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://avaliacoes-api}

# Claims customizadas colocadas pela Action do Auth0
app.auth0.claims-namespace=${AUTH0_CLAIMS_NAMESPACE:https://avaliacoes-api}
app.auth0.roles-claim=${app.auth0.claims-namespace}/roles
app.auth0.email-claim=${app.auth0.claims-namespace}/email

# Origens liberadas no CORS (separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
