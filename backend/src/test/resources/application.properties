spring.datasource.url=jdbc:h2:mem:avaliacoes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://teste.auth0.local/
spring.security.oauth2.resourceserver.jwt.audiences=https://avaliacoes-api

app.auth0.claims-namespace=https://avaliacoes-api
app.auth0.roles-claim=${app.auth0.claims-namespace}/roles
app.auth0.email-claim=${app.auth0.claims-namespace}/email
app.cors.allowed-origins=http://localhost:5173
