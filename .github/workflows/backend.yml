name: Back-end - testes e deploy na EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Executar testes
        run: mvn --batch-mode verify

  deploy:
    name: Deploy na EC2
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_DIR: /home/ubuntu/avaliacoes
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Verificar secrets e variáveis
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
        run: |
          faltando=0
          for nome in EC2_HOST EC2_SSH_KEY DB_PASSWORD AUTH0_DOMAIN; do
            if [ -z "${!nome}" ]; then echo "::error::Configure $nome no repositório"; faltando=1; fi
          done
          exit $faltando

      - name: Definir nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copiar docker-compose.yml para a EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/docker-compose.yml
          target: ${{ env.APP_DIR }}
          strip_components: 1

      - name: Atualizar containers na EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            umask 077
            cat > .env <<'EOF'
            API_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }}
            AUTH0_AUDIENCE=${{ vars.AUTH0_AUDIENCE }}
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
            EOF
            echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            sudo docker compose pull
            sudo docker compose up --detach --no-build --remove-orphans
            sudo docker logout ghcr.io
            sudo docker image prune --force
            sudo docker compose ps

      - name: Verificar API publicada (sem token deve responder 401)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for tentativa in $(seq 1 36); do
            codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://$EC2_HOST:8080/avaliacoes" || true)
            echo "Tentativa $tentativa: HTTP $codigo"
            if [ "$codigo" = "401" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::A API não respondeu como esperado"
          exit 1
